spring.application.name=loan-test

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/testdb
spring.datasource.username=test
spring.datasource.password=test
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=loan

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/loan
spring.flyway.schemas=loan

# JWT
jwt.secret=ThisIsATestSecretKeyForJwtTokenGenerationThatIsLongEnough256Bits
jwt.expiration-ms=3600000
jwt.service-expiration-ms=120000

# Eureka disabled for tests
eureka.client.enabled=false

# Loan properties
loan.prefix=LN
loan.body-digits=10
loan.upper-bound=10000000000
loan.max-attempts=5
loan.min-amount=100.00
loan.max-amount=1000000.00
loan.min-term-months=1
loan.max-term-months=360

# Service URLs (for inter-service communication)
loan.account-service-base=http://localhost:8083
loan.customer-service-base=http://localhost:8082
loan.endpoint-owned=/account/internal/owned
loan.endpoint-deposit=/account/internal/deposit
loan.endpoint-withdraw=/account/internal/withdraw
loan.endpoint-payment=/account/internal/payment
