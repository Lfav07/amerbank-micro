apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: amerbank
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: kafka
  ports:
    - name: plaintext
      protocol: TCP
      port: 29092
      targetPort: 29092
    - name: plaintext-host
      protocol: TCP
      port: 9092
      targetPort: 9092
    - name: controller
      protocol: TCP
      port: 29093
      targetPort: 29093
    - name: jmx
      protocol: TCP
      port: 9101
      targetPort: 9101
